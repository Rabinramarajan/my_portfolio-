<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'>
  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#16171d'/>
      <stop offset='50%' stop-color='#0b0c10'/>
      <stop offset='100%' stop-color='#050507'/>
    </linearGradient>
    
    <linearGradient id='borderGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#6366f1'/>
      <stop offset='50%' stop-color='#8b5cf6'/>
      <stop offset='100%' stop-color='#d946ef'/>
    </linearGradient>
    
    <linearGradient id='rrGrad1' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#818cf8'/>
      <stop offset='50%' stop-color='#c084fc'/>
      <stop offset='100%' stop-color='#f472b6'/>
    </linearGradient>

    <linearGradient id='rrGrad2' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#38bdf8'/>
      <stop offset='50%' stop-color='#818cf8'/>
      <stop offset='100%' stop-color='#c084fc'/>
    </linearGradient>

    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='10' result='blur' />
      <feComposite in='SourceGraphic' in2='blur' operator='over' />
    </filter>
  </defs>

  <!-- Dark Premium Squircle Container -->
  <rect x='16' y='16' width='480' height='480' rx='112' fill='url(#bgGrad)' stroke='url(#borderGrad)' stroke-width='8' />
  <rect x='24' y='24' width='464' height='464' rx='104' fill='none' stroke='#ffffff' stroke-opacity='0.08' stroke-width='2' />

  <!-- Monogram RR -->
  <g filter='url(#glow)'>
    <!-- First 'R' -->
    <rect x='100' y='130' width='46' height='252' rx='12' fill='url(#rrGrad1)' />
    <path d='M 146 130 H 215 C 255 130 278 152 278 188 C 278 224 255 246 215 246 H 146 Z M 190 172 V 204 H 213 C 226 204 234 197 234 188 C 234 179 226 172 213 172 Z' fill='url(#rrGrad1)' />
    <path d='M 190 236 L 262 376 C 265 382 272 382 280 382 H 288 C 295 382 298 373 293 366 L 218 236 Z' fill='url(#rrGrad1)' />

    <!-- Second 'R' -->
    <rect x='250' y='130' width='46' height='252' rx='12' fill='url(#rrGrad2)' />
    <path d='M 296 130 H 365 C 405 130 428 152 428 188 C 428 224 405 246 365 246 H 296 Z M 340 172 V 204 H 363 C 376 204 384 197 384 188 C 384 179 376 172 363 172 Z' fill='url(#rrGrad2)' />
    <path d='M 340 236 L 412 376 C 415 382 422 382 430 382 H 438 C 445 382 448 373 443 366 L 368 236 Z' fill='url(#rrGrad2)' />
  </g>
</svg>