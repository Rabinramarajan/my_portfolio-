<div class="wk">
  <div class="wk__inner">
    <app-section-header
      [level]="1"
      [eyebrow]="sections().workPage.eyebrow"
      [heading]="sections().workPage.heading"
      [lede]="sections().workPage.lede"
    />

    <div class="wk__filters" role="group" aria-label="Filter projects by category">
      @for (category of categories(); track category) {
        <button
          type="button"
          class="wk__filter"
          [class.is-active]="filter() === category"
          [attr.aria-pressed]="filter() === category"
          (click)="filter.set(category)"
        >
          {{ category }}
        </button>
      }
    </div>

    <div class="wk__grid" aria-live="polite">
      @for (project of projects(); track project.slug; let i = $index) {
        <app-project-card
          [project]="project"
          [index]="label(i)"
          [priority]="i < 2"
          [headingLevel]="2"
        />
      } @empty {
        <p class="wk__empty">{{ uiCopy().workPageEmpty }}</p>
      }
    </div>
  </div>
</div>
