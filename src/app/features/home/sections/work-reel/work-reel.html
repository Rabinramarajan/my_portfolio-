<section id="work" class="wr">
  <div class="wr__inner">
    <app-section-header
      [index]="sections().work.index"
      [eyebrow]="sections().work.eyebrow"
      [heading]="sections().work.heading"
      [lede]="sections().work.lede"
    />

    <app-media-image
      class="wr__figure"
      [media]="media().workFlatlay"
      [parallax]="true"
      sizes="100vw"
      appReveal="mask"
    />

    <div class="wr__grid">
      <!-- No `priority` here, deliberately. On the home page this reel starts
           ~6000px down; eager-loading its first image put a 127kB screenshot on
           the critical path and pushed LCP out by ~0.9s. `/work` still marks its
           first two cards priority — there the grid *is* the top of the page. -->
      @for (project of projects(); track project.slug; let i = $index) {
        <app-project-card
          class="wr__item"
          [project]="project"
          [index]="label(i)"
          [layout]="i === 0 ? 'wide' : 'tall'"
        />
      } @empty {
        <p class="wr__empty">{{ uiCopy().workEmpty }}</p>
      }
    </div>

    <div class="wr__cta" appReveal="fade">
      <app-button routerLink="/work" variant="secondary" size="lg" [magnetic]="true">{{
        uiCopy().workCta.label
      }}</app-button>
    </div>
  </div>
</section>
