<div class="dc" aria-hidden="true">
  <div
    class="dc__stage"
    appCursorTarget="explore"
    [label]="'EXPLORE'"
    appCursorInteractive
    [size]="'lg'"
  >
    <svg class="dc__scene" viewBox="72 96 496 448" focusable="false">
      <defs>
        <radialGradient id="dc-core-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--color-accent)" stop-opacity="0.42" />
          <stop offset="100%" stop-color="var(--color-accent)" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- blueprint frame -->
      <g class="dc__frame" data-depth="1">
        <rect class="dc__frame-rect" x="104" y="148" width="432" height="360" rx="1.5" />
        <path
          class="dc__frame-tick"
          d="M104 216h20M104 284h20M104 352h20M104 420h20M516 216h20M516 284h20M516 352h20M516 420h20M172 148v-20M240 148v-20M308 148v-20M376 148v-20M444 148v-20M172 508v-20M240 508v-20M308 508v-20M376 508v-20M444 508v-20"
        />
        <text class="dc__coord" x="110" y="142">X·04</text>
        <text class="dc__coord" x="468" y="142">X·20</text>
        <text class="dc__coord" x="110" y="522">Y·04</text>
        <text class="dc__coord" x="468" y="522">Y·20</text>
      </g>

      <!-- connecting paths -->
      <g class="dc__links" data-depth="2">
        @for (link of links(); track link.id) {
          <path class="dc__link" [attr.d]="link.d" />
          @if (link.trail) {
            <path class="dc__link dc__link--trail" [attr.d]="link.d" />
          }
        }
      </g>

      <!-- micro interface fragments -->
      <g class="dc__micro" data-depth="2">
        <g transform="translate(486 146)">
          <rect class="dc__chip-box" x="-19" y="-13" width="38" height="26" rx="1.5" />
          <rect class="dc__chip-bar" x="-19" y="-13" width="38" height="5" />
          <circle class="dc__chip-dot dc__chip-dot--accent" cx="11.5" cy="-10.5" r="1" />
          <line class="dc__chip-line" x1="-14" y1="-4" x2="14" y2="-4" />
          <line class="dc__chip-line" x1="-14" y1="1" x2="7" y2="1" />
          <rect class="dc__chip-block" x="-14" y="5" width="11" height="5" rx="0.5" />
        </g>

        <g transform="translate(150 480)">
          <rect class="dc__chip-box" x="-17" y="-14" width="34" height="28" rx="1.5" />
          <circle class="dc__chip-dot dc__chip-dot--accent" cx="-12" cy="-9" r="1" />
          <line class="dc__chip-line" x1="-7" y1="-9" x2="11" y2="-9" />
          <circle class="dc__chip-dot" cx="-12" cy="-3" r="1" />
          <line class="dc__chip-line" x1="-7" y1="-3" x2="8" y2="-3" />
          <circle class="dc__chip-dot" cx="-12" cy="3" r="1" />
          <line class="dc__chip-line" x1="-7" y1="3" x2="11" y2="3" />
          <line class="dc__chip-line" x1="-12" y1="9" x2="4" y2="9" />
        </g>

        <g transform="translate(484 300)">
          <rect class="dc__chip-box" x="-15" y="-10" width="30" height="20" rx="1.5" />
          <line class="dc__chip-line" x1="-9" y1="0" x2="9" y2="0" />
          <circle class="dc__chip-thumb" cx="2.5" cy="0" r="2.3" />
        </g>
      </g>

      <!-- tiny data points drifting along the framework -->
      <g class="dc__points" data-depth="2">
        <circle class="dc__point" cx="252" cy="270" r="1.1" style="animation-delay: -0.6s" />
        <circle class="dc__point" cx="396" cy="325" r="1.1" style="animation-delay: -1.8s" />
        <circle class="dc__point" cx="318" cy="392" r="1" style="animation-delay: -2.7s" />
        <circle class="dc__point" cx="246" cy="318" r="1" style="animation-delay: -3.4s" />
        <circle class="dc__point" cx="332" cy="288" r="1" style="animation-delay: -4.2s" />
        <circle class="dc__point" cx="418" cy="398" r="1" style="animation-delay: -1.2s" />
        <circle class="dc__point" cx="288" cy="442" r="1" style="animation-delay: -2.1s" />
      </g>

      <!-- nodes -->
      <g class="dc__nodes" data-depth="3">
        @for (node of nodes(); track node.id) {
          <g class="dc__node dc__node--{{ node.kind }}" [attr.transform]="'translate(' + node.x + ' ' + node.y + ')'">
            <circle class="dc__node-halo" r="7" />
            <circle class="dc__node-dot" r="2.4" />
            @if (node.label) {
              <text class="dc__label" x="13" y="3.2">{{ node.label }}</text>
            }
          </g>
        }
      </g>

      <!-- central core -->
      <g class="dc__core" data-depth="3">
        <circle class="dc__core-halo" [attr.cx]="core.x" [attr.cy]="core.y" r="30" />
        <circle class="dc__core-halo dc__core-halo--ring" [attr.cx]="core.x" [attr.cy]="core.y" r="9" />
        <circle class="dc__core-dot" [attr.cx]="core.x" [attr.cy]="core.y" r="3.4" />
      </g>
    </svg>
  </div>
</div>
