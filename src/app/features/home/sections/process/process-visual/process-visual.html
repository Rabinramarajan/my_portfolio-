<div class="pv__stage" aria-hidden="true">
  @if (media(); as current) {
    <picture class="pv__art">
      @for (source of current.media.sources; track source.type) {
        <source [type]="source.type" [srcset]="source.srcset" sizes="(max-width: 640px) 90vw, 640px" />
      }
      <img
        class="pv__img"
        [src]="current.media.src"
        alt=""
        [width]="current.media.width"
        [height]="current.media.height"
        decoding="async"
      />
    </picture>
  }
</div>
