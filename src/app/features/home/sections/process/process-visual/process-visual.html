<div class="pv__stage" aria-hidden="true">
  @for (visual of visuals; track visual.key; let i = $index) {
    <picture class="pv__art" [class.is-active]="i === activeStep()" [attr.data-key]="visual.key">
      @for (source of visual.media.sources; track source.type) {
        <source [type]="source.type" [srcset]="source.srcset" sizes="(max-width: 640px) 90vw, 640px" />
      }
      <img
        class="pv__img"
        [src]="visual.media.src"
        alt=""
        [width]="visual.media.width"
        [height]="visual.media.height"
        decoding="async"
        loading="lazy"
      />
    </picture>
  }
</div>
