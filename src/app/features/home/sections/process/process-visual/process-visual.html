<div class="pv__stage">
  @switch (key()) {
    @case ('discover') {
      <svg class="pv__icon pv__icon--discover" viewBox="0 0 120 120" fill="none">
        <rect x="24" y="18" width="56" height="72" rx="4" />
        <line x1="36" y1="36" x2="68" y2="36" />
        <line x1="36" y1="48" x2="68" y2="48" />
        <line x1="36" y1="60" x2="56" y2="60" />
        <circle class="pv__icon-accent-fill" cx="72" cy="76" r="14" />
        <line class="pv__icon-accent" x1="82" y1="86" x2="96" y2="100" stroke-width="4" />
      </svg>
    }
    @case ('define') {
      <svg class="pv__icon pv__icon--define" viewBox="0 0 120 120" fill="none">
        <line x1="30" y1="30" x2="60" y2="66" />
        <line x1="90" y1="30" x2="60" y2="66" />
        <line x1="60" y1="66" x2="60" y2="96" />
        <circle class="pv__icon-accent-fill" cx="30" cy="24" r="9" />
        <circle class="pv__icon-accent-fill" cx="90" cy="24" r="9" />
        <circle cx="60" cy="102" r="9" />
      </svg>
    }
    @case ('design') {
      <svg class="pv__icon pv__icon--design" viewBox="0 0 120 120" fill="none">
        <rect x="16" y="34" width="60" height="46" rx="5" opacity="0.4" />
        <rect x="28" y="24" width="60" height="46" rx="5" opacity="0.7" />
        <rect class="pv__icon-accent" x="40" y="14" width="60" height="46" rx="5" />
      </svg>
    }
    @case ('build') {
      <svg class="pv__icon pv__icon--build" viewBox="0 0 120 120" fill="none">
        <path d="M34 40 L18 60 L34 80" />
        <path d="M56 32 L48 88" />
        <path class="pv__icon-accent" d="M78 40 L94 60 L78 80" />
      </svg>
    }
    @case ('test') {
      <svg class="pv__icon pv__icon--test" viewBox="0 0 120 120" fill="none">
        <rect x="20" y="20" width="80" height="20" rx="6" opacity="0.35" />
        <rect x="20" y="50" width="80" height="20" rx="6" opacity="0.65" />
        <rect class="pv__icon-accent" x="20" y="80" width="80" height="20" rx="6" />
        <path class="pv__icon-accent" d="M32 90 L38 96 L52 82" stroke-width="4" />
      </svg>
    }
    @case ('launch') {
      <svg class="pv__icon pv__icon--launch" viewBox="0 0 120 120" fill="none">
        <path
          class="pv__icon-accent"
          d="M60 14 C74 26 78 46 74 64 L46 64 C42 46 46 26 60 14 Z"
        />
        <circle class="pv__icon-accent-fill" cx="60" cy="40" r="7" />
        <path d="M46 64 L34 84 L50 78" />
        <path d="M74 64 L86 84 L70 78" />
        <line x1="60" y1="76" x2="60" y2="102" />
      </svg>
    }
    @case ('evolve') {
      <svg class="pv__icon pv__icon--evolve" viewBox="0 0 120 120" fill="none">
        <path d="M16 92 L38 74 L56 82 L78 48 L104 26" />
        <circle class="pv__icon-accent-fill" cx="104" cy="26" r="7" />
      </svg>
    }
  }
</div>
