<nav class="ecat" role="group" aria-label="Filter technologies by category" appReveal="fade">
  <button
    type="button"
    class="ecat__btn"
    [class.is-active]="active() === null"
    (click)="select(null)"
    [attr.aria-pressed]="active() === null"
    title="Show all technologies"
  >
    All
  </button>
  @for (cat of categories(); track cat) {
    <button
      type="button"
      class="ecat__btn"
      [class.is-active]="active() === cat"
      (click)="select(cat)"
      [attr.aria-pressed]="active() === cat"
      [title]="getCategoryDescription(cat)"
      [attr.aria-describedby]="'cat-tooltip-' + cat"
    >
      {{ cat }}
    </button>
  }
</nav>
