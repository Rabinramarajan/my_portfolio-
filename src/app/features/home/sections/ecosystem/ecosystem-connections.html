<svg
  class="econn"
  viewBox="0 0 100 100"
  preserveAspectRatio="xMidYMid meet"
  aria-hidden="true"
  focusable="false"
>
  @for (line of lines(); track line.id) {
    <line
      class="econn__line"
      [class.is-active]="line.isActive"
      [attr.x1]="line.x1"
      [attr.y1]="line.y1"
      [attr.x2]="line.x2"
      [attr.y2]="line.y2"
      pathLength="1"
    />
  }
</svg>
