  <!-- Fonts are self-hostable later; preconnect keeps the first paint honest
         until then, and `display=swap` means text never waits on the network. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Load fonts synchronously but with display=swap so they don't block render, but fetch at high priority for early LCP text paint -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
